<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .t{fill:#0f172a}.m{font-family:ui-monospace,Menlo,Consolas,monospace}.s{fill:#475569}
      .read{fill:#dcfce7;stroke:#16a34a}.write{fill:#fee2e2;stroke:#dc2626}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" class="t">Job Desk: два агенти й MCP-сервер, якого в них не було</text>

  <!-- request + orchestrator -->
  <rect x="40" y="76" width="200" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="140" y="108" font-size="16" text-anchor="middle" class="t">Запит користувача</text>
  <line x1="240" y1="103" x2="318" y2="103" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="320" y="76" width="380" height="54" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="510" y="100" font-size="16" font-weight="600" text-anchor="middle" class="t">Orchestrator (звичайний Python, без LLM)</text>
  <text x="510" y="119" font-size="13" text-anchor="middle" class="s">порядок кроків, передача чернеток, 1 раунд правок</text>

  <!-- scout -->
  <rect x="40" y="190" width="400" height="140" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="60" y="220" font-size="19" font-weight="700" fill="#0e7490">Агент A · Scout</text>
  <text x="60" y="244" font-size="14" class="s">шукає вакансії, готує листи з фактів CV.</text>
  <text x="60" y="262" font-size="14" class="s">Писати не може: інструмента apply в нього немає.</text>
  <rect x="60" y="282" width="130" height="32" rx="16" class="read"/><text x="125" y="303" font-size="14" text-anchor="middle" class="m t">search_jobs</text>
  <rect x="204" y="282" width="100" height="32" rx="16" class="read"/><text x="254" y="303" font-size="14" text-anchor="middle" class="m t">get_job</text>

  <!-- reviewer -->
  <rect x="560" y="190" width="400" height="140" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="580" y="220" font-size="19" font-weight="700" fill="#7e22ce">Агент B · Reviewer</text>
  <text x="580" y="244" font-size="14" class="s">звіряє лист із CV і запитом, прибирає вигадане.</text>
  <text x="580" y="262" font-size="14" class="s">Єдиний, хто має право писати.</text>
  <rect x="580" y="282" width="100" height="32" rx="16" class="read"/><text x="630" y="303" font-size="14" text-anchor="middle" class="m t">get_job</text>
  <rect x="694" y="282" width="150" height="32" rx="16" class="write"/><text x="769" y="303" font-size="14" font-weight="700" text-anchor="middle" class="m t">apply  ✎ WRITE</text>

  <line x1="400" y1="130" x2="260" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="156" font-size="12" class="s">запит + CV</text>
  <line x1="620" y1="130" x2="760" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="716" y="156" font-size="12" class="s">запит + CV + чернетки</text>
  <line x1="440" y1="236" x2="558" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="499" y="228" font-size="12" text-anchor="middle" class="s">чернетки JSON</text>
  <line x1="558" y1="292" x2="442" y2="292" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="499" y="312" font-size="12" text-anchor="middle" class="s">feedback (≤ 1 раз)</text>

  <!-- MCP client bar -->
  <line x1="240" y1="330" x2="240" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="330" x2="760" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="382" width="920" height="44" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="500" y="410" font-size="15" text-anchor="middle" class="t">MCP-клієнт (stdio): кожен агент отримує власний процес сервера зі своїм AGENT_ROLE</text>
  <line x1="500" y1="426" x2="500" y2="458" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- server -->
  <rect x="40" y="460" width="920" height="186" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="60" y="488" font-size="18" font-weight="700" class="t">MCP-сервер <tspan class="m">jobdesk</tspan>: інструменти, яких в агентів не було</text>
  <rect x="60" y="504" width="270" height="86" rx="10" class="read"/>
  <text x="76" y="530" font-size="16" font-weight="700" class="m t">search_jobs</text>
  <text x="76" y="552" font-size="13" class="s">READ · пошук в індексі, без статусу</text>
  <text x="76" y="572" font-size="13" class="s">(індекс може бути застарілим)</text>
  <rect x="355" y="504" width="270" height="86" rx="10" class="read"/>
  <text x="371" y="530" font-size="16" font-weight="700" class="m t">get_job</text>
  <text x="371" y="552" font-size="13" class="s">READ · жива картка вакансії,</text>
  <text x="371" y="572" font-size="13" class="s">status: open | closed</text>
  <rect x="650" y="504" width="290" height="86" rx="10" class="write"/>
  <text x="666" y="530" font-size="16" font-weight="700" class="m t">apply</text>
  <text x="666" y="552" font-size="13" class="s">WRITE · рядок у applications.csv</text>
  <text x="666" y="572" font-size="13" class="s">scout → forbidden, нічого не пишеться</text>
  <text x="60" y="624" font-size="13" class="s">Помилка = {error, message, hint, retryable}, сервер не падає:</text>
  <text x="60" y="640" font-size="13" class="s m">forbidden · unknown_job · job_closed · already_applied · needs_input · human_only_question · …</text>

  <!-- data stores -->
  <line x1="195" y1="646" x2="195" y2="664" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="646" x2="490" y2="664" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="795" y1="646" x2="795" y2="664" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="666" width="270" height="40" rx="8" fill="#ffffff" stroke="#16a34a"/><text x="195" y="691" font-size="14" text-anchor="middle" class="m t">data/jobs.json (читання)</text>
  <rect x="355" y="666" width="270" height="40" rx="8" fill="#ffffff" stroke="#64748b"/><text x="490" y="691" font-size="14" text-anchor="middle" class="m t">mcp_calls.jsonl (аудит ролей)</text>
  <rect x="650" y="666" width="290" height="40" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="795" y="691" font-size="14" text-anchor="middle" class="m t">applications.csv (пише лише apply)</text>

  <!-- tracing -->
  <rect x="995" y="76" width="245" height="168" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1013" y="104" font-size="17" font-weight="700" fill="#c2410c">Трейсинг</text>
  <text x="1013" y="128" font-size="13" class="s">хуки Pre / PostToolUse пишуть</text>
  <text x="1013" y="146" font-size="13" class="s">кожну подію в trace.jsonl:</text>
  <text x="1013" y="170" font-size="13" class="s m">run → agent →</text>
  <text x="1013" y="188" font-size="13" class="s m">tool_call / tool_result</text>
  <text x="1013" y="206" font-size="13" class="s m">+ handoff між агентами</text>
  <text x="1013" y="230" font-size="13" class="s">scripts/trace_view.py → HTML</text>
  <line x1="960" y1="215" x2="993" y2="215" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>

  <!-- eval -->
  <rect x="995" y="276" width="245" height="230" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1013" y="304" font-size="17" font-weight="700" fill="#15803d">Оцінка точності</text>
  <text x="1013" y="330" font-size="13" class="s">5 запитів × {2 агенти,</text>
  <text x="1013" y="348" font-size="13" class="s">1 агент} × 3 повтори</text>
  <text x="1013" y="376" font-size="13" class="s">graders.py читають</text>
  <text x="1013" y="394" font-size="13" class="s">applications.csv і аудит-лог,</text>
  <text x="1013" y="412" font-size="13" class="s">без LLM-суддів</text>
  <text x="1013" y="440" font-size="13" class="s">report.md: точність, ціна,</text>
  <text x="1013" y="458" font-size="13" class="s">помилки сервера, правки</text>
  <text x="1013" y="476" font-size="13" class="s">Reviewer</text>

  <!-- legend -->
  <rect x="995" y="536" width="22" height="14" rx="4" class="read"/><text x="1026" y="548" font-size="13" class="s">читання</text>
  <rect x="1110" y="536" width="22" height="14" rx="4" class="write"/><text x="1141" y="548" font-size="13" class="s">запис</text>
  <text x="995" y="580" font-size="13" class="s">Право писати має рівно один агент:</text>
  <text x="995" y="598" font-size="13" class="s">1) його немає в списку інструментів Scout,</text>
  <text x="995" y="616" font-size="13" class="s">2) сервер перевіряє AGENT_ROLE ще раз.</text>
</svg>
