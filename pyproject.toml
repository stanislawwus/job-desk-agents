[project]
name = "jobs-helper-djinni"
version = "0.9.0"
description = "Mini-project version of jobs_helper_MCP: two agents (Scout + Reviewer) that search and apply to Djinni vacancies through a custom MCP server with 3 tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.10",
    "httpx>=0.27",
    "lxml>=5.0",
    "mcp>=2.3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
jobs-mcp = "jobs_helper.mcp_jobs.server:main"

[project.urls]
Original = "https://github.com/xsponenta/jobs_helper_MCP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobs_helper"]

[dependency-groups]
agents = ["claude-agent-sdk>=0.2.168"]

[tool.uv]
default-groups = ["agents"]
