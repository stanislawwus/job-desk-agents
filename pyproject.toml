[project]
name = "job-desk-agents"
version = "0.1.0"
description = "Two agents (Scout + Reviewer) that get their tools from a custom MCP server: mini-project for the Generative AI course"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "claude-agent-sdk>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
